experiment: Asynchronous Dual Stream U-Net baseline
research_question: Can historical Sentinel-2 optical imagery improve Sentinel-1-based
  urban change detection when contemporaneous Sentinel-2 imagery is unavailable?
seed: 42
pytorch_version: 2.5.1+cu124
cuda_available: true
gpu_name: NVIDIA GeForce RTX 4060 Laptop GPU
device: cuda
learning_rate: 0.0001
batch_size: 64
epochs: 50
crop_size: 32
crops_per_city: 64
loss_function: BCEWithLogitsLoss
optimizer: Adam
model: DualStreamUNet (src/models/dual_stream_unet.py)
modality: 'Asynchronous multimodal: S1 VV (T1+T2) and historical S2 (T1 only; T2 zero-filled)'
sar_input_channels: 2
optical_input_channels: 26
total_input_channels: 28
base_channels: 64
